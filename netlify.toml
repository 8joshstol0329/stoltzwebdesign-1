# Netlify settings for stoltzwebdesign.com
# Safe security headers that don't block fonts, icons, or Formspree.
# (A Content-Security-Policy is left out on purpose: the site uses inline
#  scripts and onload handlers that a strict CSP would block.)

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
